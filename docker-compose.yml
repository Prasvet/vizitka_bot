services:
  bot:
    build: .
    container_name: vizitka_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Полезно для отладки: не скрывать вывод, если что-то падает сразу
    stdin_open: false
    tty: false
